[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memlet"
version = "9.0.0"
description = "Code-anchored, re-checkable agent memory"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Ian (Nocturne Lab)"}
]
dependencies = []

[project.optional-dependencies]
semantic = [
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "tokenizers>=0.15",
]

[project.scripts]
memlet = "memory_cli:cli"
memlet-mcp = "memlet_mcp:main"

[tool.setuptools]
packages = ["memlet"]
py-modules = [
    "work_memory",
    "memory_vectors",
    "memory_skills",
    "memory_intelligence",
    "memory_cli",
    "memlet_mcp",
]
