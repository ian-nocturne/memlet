name: "Memlet Check (Instruction & Memory Drift Guard)"
description: "Memlet Check: instruction and memory drift audit for agent rule files."
author: "Ian"
branding:
  icon: "shield"
  color: "blue"

inputs:
  mode:
    description: "Only 'audit' is supported (default). Every other mode was removed in 9.0 and is a configuration error (exit 2)."
    required: false
    default: "audit"
  repo-path:
    description: "Target repository path to scan."
    required: false
    default: "."
  base-ref:
    description: "Optional Git base ref (e.g. origin/main or github.event.pull_request.base.sha) for blast-radius diff analysis."
    required: false
    default: ""
  head-ref:
    description: "Git head ref for diff analysis."
    required: false
    default: "HEAD"
  format:
    description: "Report format: 'markdown' (default), 'json', or 'sarif' (SARIF v2.1.0)."
    required: false
    default: "markdown"
  fail-on-drift:
    description: "Fail on drift: 'true' or 'false' only (empty means 'true'). Invalid values or malformed audit results always fail with exit 2."
    required: false
    default: "true"
  sarif-file:
    description: "Optional SARIF output path. A symlink at this path is refused (exit 2)."
    required: false
    default: "memlet-check.sarif"
  python-version:
    description: "Python version to install with actions/setup-python (for example '3.11'). Default is empty: the Action does not change the caller's Python and uses the interpreter already on the runner, which must be >= 3.9. Releases before this input existed always installed Python 3.11; set '3.11' to keep that behaviour."
    required: false
    default: ""

outputs:
  status:
    description: "Audit status: 'PASS', 'DRIFT_DETECTED', or 'UNVERIFIED'. Missing instruction docs or unverifiable commands block."
    value: ${{ steps.run-gate.outputs.status }}
  finding-count:
    description: "Number of blocking/error findings across active gates."
    value: ${{ steps.run-gate.outputs.finding_count }}
  total-finding-count:
    description: "Total number of all findings (including warnings and hygiene notices)."
    value: ${{ steps.run-gate.outputs.total_finding_count }}

runs:
  using: "composite"
  steps:
    - name: Set up Python (only when python-version is set)
      if: ${{ inputs.python-version != '' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Run Memlet Check Gate
      id: run-gate
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_REPO_PATH: ${{ inputs.repo-path }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_HEAD_REF: ${{ inputs.head-ref }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        export PYTHONPATH="${ACTION_PATH}:${PYTHONPATH:-}"

        # Use the Python already on the runner (or the one installed above). Never install one implicitly.
        PY=""
        for candidate in python3 python; do
          if command -v "$candidate" >/dev/null 2>&1 \
            && "$candidate" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)' >/dev/null 2>&1; then
            PY="$candidate"
            break
          fi
        done
        if [ -z "$PY" ]; then
          echo "::error title=Memlet Check::No Python >= 3.9 found on this runner (tried python3, python). Set the 'python-version' input (for example '3.11') to let the Action install one."
          exit 2
        fi

        # Verdict rules (blockers vs warnings), the 'format' input and the outputs live in memlet/action_verdict.py.
        "$PY" -m memlet.action_verdict
