name: "Memlet Check (Instruction & Memory Drift Guard)"
description: "Memlet Check: zero-setup instruction & memory drift guard (`CLAUDE.md`, `AGENTS.md`, `.cursorrules`, `SKILL.md`) with VibeRescue preflight and Anti-Slop UI/copy gate. Formerly DeltaHarness / Ieum Check; inputs and outputs unchanged."
author: "Ian · Nocturne Lab"
branding:
  icon: "shield"
  color: "blue"

inputs:
  mode:
    description: "Gate mode to execute: 'audit' (instruction/symbol drift), 'rescue' (env/deploy cliff bundle), 'anti-slop' (UI/copy slop score), or 'all'."
    required: false
    default: "audit"
  repo-path:
    description: "Target repository path to scan."
    required: false
    default: "."
  base-ref:
    description: "Optional Git base ref (e.g. origin/main or github.event.pull_request.base.sha) for blast-radius diff analysis."
    required: false
    default: ""
  head-ref:
    description: "Git head ref for diff analysis."
    required: false
    default: "HEAD"
  format:
    description: "Format of the report printed to the job log and step summary: 'markdown' (default, all gates), 'json' (one JSON document with the verdict and each active gate's result), or 'sarif' (the audit SARIF v2.1.0 document; needs mode 'audit' or 'all', other gates are reported in the step summary only)."
    required: false
    default: "markdown"
  fail-on-drift:
    description: "Exit with non-zero code if high-severity drift or deploy blockers are detected ('true' or 'false'). Only 'true' or 'false' is accepted (empty means 'true'); any other value is a configuration error (exit 2). Warnings (rescue ENV_UNVERIFIED, anti-slop with no UI/copy files) never fail the job. A malformed checker result always fails (exit 2)."
    required: false
    default: "true"
  sarif-file:
    description: "Optional path to write SARIF v2.1.0 output for GitHub Code Scanning. The file is never written through a symbolic link: a symlink at this path is refused (exit 2). The default file name keeps its legacy value for backward compatibility; the SARIF tool.driver.name is set by the bundled checker and may show a legacy name (Ieum Memory / DeltaHarness) depending on the release."
    required: false
    default: "deltaharness-audit.sarif"
  python-version:
    description: "Python version to install with actions/setup-python (for example '3.11'). Default is empty: the Action does not change the caller's Python and uses the interpreter already on the runner, which must be >= 3.9. Releases before this input existed always installed Python 3.11; set '3.11' to keep that behaviour."
    required: false
    default: ""

outputs:
  status:
    description: "Overall gate status: 'PASS', 'DRIFT_DETECTED' (real findings), or 'UNVERIFIED' (something could not be checked; never reported as PASS). UNVERIFIED fails the job for blockers (e.g. no instruction docs) and passes it for warnings (rescue ENV_UNVERIFIED, no UI/copy files)."
    value: ${{ steps.run-gate.outputs.status }}
  finding-count:
    description: "Number of blocking/error findings across active gates."
    value: ${{ steps.run-gate.outputs.finding_count }}
  total-finding-count:
    description: "Total number of all findings (including warnings and hygiene notices)."
    value: ${{ steps.run-gate.outputs.total_finding_count }}
  slop-score:
    description: "AI Slop Score (0-100, lower is cleaner) when mode includes 'anti-slop'."
    value: ${{ steps.run-gate.outputs.slop_score }}

runs:
  using: "composite"
  steps:
    - name: Set up Python (only when python-version is set)
      if: ${{ inputs.python-version != '' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Run Memlet Check Gate
      id: run-gate
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_REPO_PATH: ${{ inputs.repo-path }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_HEAD_REF: ${{ inputs.head-ref }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        export PYTHONPATH="${ACTION_PATH}:${PYTHONPATH:-}"

        # Use the Python already on the runner (or the one installed above). Never install one implicitly.
        PY=""
        for candidate in python3 python; do
          if command -v "$candidate" >/dev/null 2>&1 \
            && "$candidate" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)' >/dev/null 2>&1; then
            PY="$candidate"
            break
          fi
        done
        if [ -z "$PY" ]; then
          echo "::error title=Memlet Check::No Python >= 3.9 found on this runner (tried python3, python). Set the 'python-version' input (for example '3.11') to let the Action install one."
          exit 2
        fi

        # Verdict rules (blockers vs warnings), the 'format' input and the outputs live in prism_memory/action_verdict.py.
        "$PY" -m prism_memory.action_verdict
